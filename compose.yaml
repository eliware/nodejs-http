services:
  web:
    image: nodejs-http:local
    build:
      context: .
    container_name: nodejs-http-local
    ports:
      - "127.0.0.1:7100:7100"
    volumes:
      - type: bind
        source: ${REPOSITORY_ROOT:?Set REPOSITORY_ROOT to the published repository directory}
        target: /srv/repository
        read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7100/ready').then(response => { if (!response.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
