<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} · Eliware Node.js</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        background: #101820;
        color: #edf4f7;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: auto;
      }
      a {
        color: #7ee0c3;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1.5rem;
      }
      th,
      td {
        padding: 0.75rem;
        border-bottom: 1px solid #35444b;
        text-align: left;
      }
      th {
        color: #b3c2c8;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        <a href="/">Eliware Node.js 26</a> · <a href="/install">Install</a> ·
        <a href="/metadata/catalog.json">Catalog</a>
      </p>
      <h1>{{TITLE}}</h1>
      {{BREADCRUMBS}}
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Size</th>
            <th>Modified</th>
          </tr>
        </thead>
        <tbody>
          {{ROWS}}
        </tbody>
      </table>
      <p>{{SUMMARY}}</p>
      {{VALIDATION}}
    </main>
  </body>
</html>
