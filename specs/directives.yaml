version: "15.1"
description: Requirements for the Node.js HTTP repository and web frontend.
directives:
  - id: E-7003.0
    dos:
      - Return published Node.js content through read-only HTTP routes.
      - Keep package construction, signing, migration, and publication in the packaging repository.
      - Document the runtime and publication boundaries in README.md.
    donts:
      - Do not change published repository data through HTTP requests.
      - Do not add package builds or signing tasks to the HTTP application.
